<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#c8b2ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ムーニアンズ">
    <title>ぴょんぴーの大冒険</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/app-icon-192.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <button id="fullscreenButton" class="fullscreen-button" type="button" aria-label="Fullscreen">全画面</button>
      <section class="game-wrap" aria-label="ぴょんぴーの大冒険 game">
        <canvas id="game" width="1280" height="720"></canvas>
        <div id="installHint" class="install-hint hidden" role="status"></div>
        <div class="touch-controls" aria-label="Touch controls">
          <div class="touch-side touch-side-left">
            <div class="touch-top-group">
              <button class="touch-shoulder" data-key="Select" type="button" aria-label="L Button">L</button>
              <button class="touch-small" data-key="Select" type="button" aria-label="Select">SELECT</button>
            </div>
            <div class="touch-dpad" aria-label="Move">
              <button class="touch-button up" data-key="ArrowUp" type="button" aria-label="Up">&uarr;</button>
              <button class="touch-button left" data-key="ArrowLeft" type="button" aria-label="Left">&larr;</button>
              <button class="touch-button down" data-key="ArrowDown" type="button" aria-label="Down">&darr;</button>
              <button class="touch-button right" data-key="ArrowRight" type="button" aria-label="Right">&rarr;</button>
            </div>
          </div>
          <div class="touch-side touch-side-right">
            <div class="touch-top-group">
              <button class="touch-shoulder" data-key="Enter" type="button" aria-label="R Button">R</button>
              <button class="touch-small" data-key="Enter" type="button" aria-label="Start">START</button>
            </div>
            <div class="touch-actions" aria-label="Actions">
              <button class="touch-action y" data-key="KeyY" type="button" aria-label="Shoot Y">Y</button>
              <button class="touch-action shoot" data-key="KeyX" type="button" aria-label="Shoot">X</button>
              <button class="touch-action jump" data-key="Space" type="button" aria-label="Jump">A</button>
              <button class="touch-action run" data-key="KeyB" type="button" aria-label="Dash">B</button>
            </div>
          </div>
        </div>
        <div id="overlay" class="overlay">
          <div class="language-switch" aria-label="Language">
            <button id="langJa" class="active" type="button">日本語</button>
            <button id="langEn" type="button">English</button>
          </div>
          <div class="control-switch" aria-label="Control mode">
            <button id="modeIphone" type="button" data-control-mode="iphone">iPhone</button>
            <button id="modeIpad" type="button" data-control-mode="ipad">iPad</button>
            <button id="modePc" type="button" data-control-mode="pc">PC</button>
          </div>
          <img class="brand-logo" src="assets/moonians-logo.png" alt="ムーニアンズ">
          <h1 class="game-title">ぴょんぴーの大冒険</h1>
          <div id="titleSub" class="title-sub">〜 ワライスターをとりもどせ 〜</div>
          <p>移動: ← → / A D、ジャンプ: Space、ダッシュ: Shift、攻撃: J / X</p>
          <div class="title-actions">
            <button id="startButton" class="primary-button" type="button">Start</button>
            <button id="newGameButton" class="ghost-button hidden" type="button">はじめから</button>
            <button id="soundButton" class="ghost-button" type="button" aria-label="Sound">♪ ON</button>
          </div>
        </div>
      </section>
      <div id="commPanel" class="comm-panel" aria-live="polite">
        <div class="comm-weapon">
          <span id="commWeaponLabel" class="comm-label">そうび中</span>
          <img id="commWeaponIcon" alt="">
          <div class="comm-weapon-info">
            <div class="comm-weapon-title"><strong id="commWeaponName"></strong><span id="commWeaponLv"></span></div>
            <div class="comm-stats">
              <span id="commLabAtk">攻撃</span><i><b id="commAtk"></b></i>
              <span id="commLabRange">射程</span><i><b id="commRange"></b></i>
              <span id="commLabRapid">連射</span><i><b id="commRapid"></b></i>
            </div>
            <div id="commWeaponHint" class="comm-hint"></div>
          </div>
        </div>
        <div class="comm-chat">
          <div id="commAvatar" class="comm-avatar" data-speaker="pyon"></div>
          <div class="comm-bubble">
            <strong id="commSpeaker">ぴょんぴー</strong>
            <p id="commText"></p>
          </div>
          <div class="comm-buttons">
            <button id="commEquipButton" class="comm-button" type="button">そうび・合成</button>
            <button id="commPauseButton" class="comm-button comm-button-sub" type="button">ポーズ</button>
          </div>
        </div>
      </div>
      <div class="hud" aria-live="polite">
        <span id="stageLabel">ステージ <strong id="stageCount">1</strong></span>
        <span id="kakiLabel">柿の種 <strong id="kakiCount">0</strong></span>
        <span id="peaLabel">ピーナッツ <strong id="peaCount">0</strong></span>
        <span id="scoreLabel">スコア <strong id="scoreCount">0</strong></span>
        <span class="hp-wrap" aria-label="Lives"><strong id="lifeCount">★★★</strong></span>
        <span id="timeLabel">時間 <strong id="timeCount">120</strong></span>
      </div>
    </main>
    <script src="bgm.js"></script>
    <script src="fx.js"></script>
    <script src="story.js"></script>
    <script src="chat.js"></script>
    <script src="gimmicks.js"></script>
    <script src="shop.js"></script>
    <script src="game.js"></script>
    <script>
      const isLocalPreview = ["localhost", "127.0.0.1", "::1"].includes(location.hostname);
      if ("serviceWorker" in navigator && location.protocol.startsWith("http") && !isLocalPreview) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
